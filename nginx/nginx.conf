events {
    worker_connections 1024;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Timeouts & buffers ────────────────────────────────────────────────────────
    proxy_connect_timeout       60s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;
    client_max_body_size        10m;

    # ── Upstream: Gunicorn ────────────────────────────────────────────────────────
    upstream spendly_web {
        server spendly_web:8080;
    }

    # ── HTTP server (port 80) ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;   # accepts any hostname / raw IP

        # ── Security headers ──────────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;

        # ── Root → dashboard redirect ─────────────────────────────────────────────
        location = / {
            return 302 /spendly/dashboard;
        }

        # ── Proxy all traffic to Gunicorn ─────────────────────────────────────────
        location / {
            proxy_pass         http://spendly_web;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # ── Health check endpoint (used by GCP health checks) ─────────────────────
        location = /health {
            proxy_pass http://spendly_web/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
