[project]
name = "spendly"
version = "1.0.0"
description = "AI-powered personal expense manager — Telegram + Gemini + SQLite"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "flask>=3.1.3",
    "google-genai>=1.72.0",
    "python-dotenv>=1.1.0",
    "python-telegram-bot[ext]>=22.7",
    "reportlab>=4.0.0",
    "apscheduler>=3.10.0",
    "ruff>=0.9.0",
    "gunicorn>=25.3.0",
    "google-cloud-storage>=3.10.1",
    "google-api-python-client>=2.194.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "sentry-sdk>=2.58.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]


[project.scripts]
spendly = "spendly.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"spendly/ai/prompts.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

